<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">RouteLedger logo</title>
  <desc id="desc">A dark blue navigation cursor icon followed by the RouteLedger wordmark.</desc>

  <defs>
    <linearGradient id="routeBlue" x1="35" y1="35" x2="330" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D6FA3"/>
      <stop offset="1" stop-color="#0B3A66"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(34 34)">
    <!-- soft rounded tile -->
    <rect x="0" y="0" width="352" height="352" rx="92" fill="#F3F7F1"/>

    <!-- route line -->
    <path d="M83 277 C122 236 139 209 156 172 C176 129 199 105 242 84"
          fill="none"
          stroke="#161B18"
          stroke-width="20"
          stroke-linecap="round"/>

    <!-- route waypoints -->
    <circle cx="82" cy="278" r="14" fill="#161B18"/>
    <circle cx="242" cy="84" r="14" fill="#161B18"/>

    <!-- navigation cursor -->
    <path d="M115 73 L281 144 L202 170 L164 246 Z"
          fill="url(#routeBlue)"
          stroke="#161B18"
          stroke-width="14"
          stroke-linejoin="round"/>
    <path d="M202 170 L282 145"
          fill="none"
          stroke="#161B18"
          stroke-width="14"
          stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g fill="#111714">
    <text x="440" y="270"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="132"
          font-weight="700"
          letter-spacing="-5">
      Route<tspan fill="#0B3A66">Ledger</tspan>
    </text>
  </g>
</svg>
